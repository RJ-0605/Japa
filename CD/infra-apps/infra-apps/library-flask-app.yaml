apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: library-flask-application
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: http://jenkins_cicd_argo:glpat-2QbHKetFz4WbUC_Jqd7y@kwao75.port0.org/argocd/final-project-flask-app-chart.git
    # repoURL: http://jenkins_cicd_argo:glpat-2QbHKetFz4WbUC_Jqd7y@kwao75.port0.org/argocd/flask_final_project.git
    targetRevision: HEAD
    path: lib-flask-final-proj
  destination: 
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true