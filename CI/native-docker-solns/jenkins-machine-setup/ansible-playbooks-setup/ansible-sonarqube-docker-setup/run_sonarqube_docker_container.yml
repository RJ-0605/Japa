---
- name: Install SonarQube
  hosts: your_sonarqube_server
  become: yes

  tasks:
    - name: Run SonarQube Docker container
      docker_compose:
        project_src: /path/to/your/sonarqube/docker-compose.yml
        state: present
      vars:
        docker_compose:
          services:
            sonarqube:
              image: sonarqube:latest
              networks:
                - sonarqube-network
              environment:
                - SONARQUBE_JDBC_URL=jdbc:postgresql://your_postgres_host:5432/sonar
                - SONARQUBE_JDBC_USERNAME=sonar
                - SONARQUBE_JDBC_PASSWORD=your_db_password
              ports:
                - "9000:9000"
              depends_on:
                - postgres

            postgres:
              image: postgres:latest
              networks:
                - sonarqube-network
              environment:
                - POSTGRES_USER=sonar
                - POSTGRES_PASSWORD=your_db_password
                - POSTGRES_DB=sonar