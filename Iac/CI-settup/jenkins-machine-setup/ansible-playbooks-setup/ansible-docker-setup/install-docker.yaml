---
- name: Install Docker on Ubuntu
  hosts: jenkins_servers
  become_method: sudo
  become: true
  vars_files:
    - "jenkins_variables.yaml"
  gather_facts: true


  tasks:
    - name: Update apt Cache
      apt:
        update_cache: true
        force_apt_get: true

    - name: Print current user
      debug:
        var: ansible_user_id

    - name: Create directory for Docker's GPG key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker's official GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present

    - name: Print architecture variables
      ansible.builtin.debug:
        msg: "Codename: {{ ansible_lsb.codename }}"


    - name: Setting up debian-stable repository for Docker
      ansible.builtin.apt_repository:
        repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable
        state: present
        filename: docker

    - name: Update apt Cache to fetch newer binaries
      apt:
        update_cache: true
        force_apt_get: true

    - name: Install Essential Packages
      ansible.builtin.apt:
        name: "{{ essential_packages }}"
        state: latest

    - name: Check Java version
      ansible.builtin.shell: java -version
      register: java_version

    - name: Printing Installed Java version
      ansible.builtin.debug:
        var: java_version

    - name: Install Main Packages
      ansible.builtin.apt:
        name: "{{ main_packages }}"
        state: latest

    - name: Add Docker group
      ansible.builtin.group:
        name: docker
        state: present

    - name: Adding Ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Adding Jenkins user to docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: yes

    - name: Start Services
      ansible.builtin.systemd_service:
        state: started
        enabled: true
        name: "{{ item }}"
      with_items:
        - docker.service
        - containerd.service



